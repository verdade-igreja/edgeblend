[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [
    "crates/edgeblend",
    "crates/edgeblend-config",
    "crates/edgeblend-engine",
    "crates/edgeblend-geom",
    "crates/edgeblend-gpu",
    "crates/edgeblend-remote",
    "crates/edgeblend-ui",
]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/verdade-igreja/edgeblend"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
eframe = "0.29"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false }
getrandom = "0.2"
if-addrs = "0.15"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
